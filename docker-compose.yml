services:
# Servicios locales (Descomentar para usar Mailhog en desarrollo)
#  mailhog:
#    image: mailhog/mailhog:v1.0.1
#    container_name: consultoritas_mailhog
#    ports:
#      - "1025:1025"
#      - "8025:8025"
#    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: consultoritas_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: consultoritas_backend
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
#      mailhog:
#        condition: service_started
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: consultoritas_worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
#      mailhog:
#        condition: service_started
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    command: celery -A core worker -l info
    restart: unless-stopped

  celery_beat:
    build: ./backend
    container_name: consultoritas_beat
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A core beat -l info
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: consultoritas_frontend
    env_file: .env
    command: >
      sh -c "npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: consultoritas_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media_volume:/app/media:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  media_volume:
