name: Playwright Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Environment
      run: |
        cp .env.example .env
        sed -i 's/<your-generated-secret>/django-insecure-test-key-for-ci-only/' .env
        sed -i 's|^DATABASE_URL=.*|DATABASE_URL=sqlite:////tmp/db.sqlite3|' .env
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    - name: Start Application using Docker Compose
      run: docker compose up -d --build
    - name: Wait for services
      run: |
        echo "Waiting for frontend..."
        timeout 120 bash -c 'while [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost/login)" != "200" ]; do sleep 5; done'
        echo "Waiting for backend..."
        timeout 120 bash -c 'while [ "$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/users/login/)" != "405" ]; do sleep 5; done'
    - name: Seed Database
      run: docker compose exec -T backend python manage.py seed_system
    - name: Install Playwright Browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      working-directory: ./frontend
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30
